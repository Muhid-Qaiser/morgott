version: 2

updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Karachi
    cooldown:
      default-days: 7
    groups:
      routine-python:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    open-pull-requests-limit: 2

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Karachi
    cooldown:
      default-days: 7
    groups:
      routine-docker:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    open-pull-requests-limit: 2

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Karachi
    cooldown:
      default-days: 7
    groups:
      routine-actions:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    open-pull-requests-limit: 2

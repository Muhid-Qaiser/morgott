[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "morgott"
version = "0.1.0"
description = "Reproducible jailbreak detection and agent action-policy POC"
requires-python = ">=3.11"
dependencies = [
  "datasets>=5.0.0,<6",
  "ijson>=3.4,<4",
  "scikit-learn>=1.6,<2",
]

[project.optional-dependencies]
# Needed only by experiments/ (frozen-encoder inference and head
# training). Deliberately optional: the corpus build and the retained
# baseline do not require torch.
encoder = [
    "torch>=2.13",
    "transformers>=5.14",
    "safetensors>=0.4",
]

[dependency-groups]
dev = [
  "pre-commit>=4.6.1,<5",
  "ruff>=0.15.22,<0.16",
]

[project.scripts]
morgott = "morgott.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

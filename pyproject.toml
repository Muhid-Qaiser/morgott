[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "morgott"
version = "0.1.0"
description = "Reproducible jailbreak detection and agent action-policy POC"
requires-python = ">=3.12"
dependencies = [
  "datasets>=5.0.1,<6",
  "ijson>=3.4,<4",
  "scikit-learn>=1.6,<2",
]

[project.optional-dependencies]
# Needed only for advisory mmBERT scoring and future encoder experiments.
# The corpus build and linear controls do not require torch.
encoder = [
    "torch>=2.13",
    "transformers>=5.14",
    "safetensors>=0.4",
    "peft>=0.20.0,<0.21",
]
cascade = [
    "nooa==0.0.8; python_version < '3.14'",
    "litellm==1.90.2; python_version < '3.14'",
    "numpy>=2,<3",
    "openvino==2026.2.1",
    "tokenizers>=0.22,<1",
]
encoder-export = [
    "onnx>=1.17,<2",
    "onnxruntime>=1.20,<2",
]
showcase = [
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "pandas>=3.0.5,<4",
    "pyarrow>=18,<26",
    "uvicorn>=0.52.1,<1",
]

[dependency-groups]
dev = [
  "pre-commit>=4.6.1,<5",
  "ruff>=0.16.1,<0.17",
]

[project.scripts]
morgott = "morgott.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
